<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/all.min.css">
        <link rel="stylesheet" href="css/normilaze.css">
        <link rel="stylesheet" href="css/style.css">
        <title>I-phone Calculator</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="container">
            <div class="show-res">0</div>
            <div class="other-operators row" style="display: none;">
                <button id="n-pow-2">n<sup>2</sup></button>
                <button id="n-pow-n">n<sup>n</sup></button>
                <button id="sqrt">&Sqrt;</button>
                <button id="log">log</button>
            </div>
            <div class="row">
                <button id="dlt-back" class="upper-row"><i class="fa-solid fa-delete-left"></i></button>
                <button id="dlt-all" class="upper-row">AC</button>
                <button class="upper-row" id="porm">sin</button>
                <button class="operator">&div;</button>
            </div>
            <div class="row">
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator">x</button>
            </div>
            <div class="row">
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator">&minus;</button>
            </div>
            <div class="row">
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator">&plus;</button>
            </div>
            <div class="row end">
                <button id="minus">-/+</button>
                <button class="number">0</button>
                <button id="dot">.</button>
                <button id="equal">=</button>
            </div>
        </div>

        
        <script src="JavaS/main.js"></script>
    </body>
</html>
